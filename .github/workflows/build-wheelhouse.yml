name: Build Kimodo wheelhouses

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheelhouse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            python: "3.11"
          - runner: ubuntu-22.04
            python: "3.11"
          - runner: windows-2022
            python: "3.11"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python tools/build_wheelhouse.py
      - uses: actions/upload-artifact@v4
        with:
          name: kimodo-wheelhouse-${{ runner.os }}-cp311
          path: wheelhouse/
